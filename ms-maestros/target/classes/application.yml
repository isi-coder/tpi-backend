server:
  port: 8092

spring:
  application:
    name: ms-maestros

  datasource:
    url: jdbc:postgresql://localhost:5433/tpi?options=-c%20TimeZone=America/Argentina/Buenos_Aires
    username: tpi
    password: tpi

  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate.default_schema: maestros
      hibernate.dialect: org.hibernate.dialect.PostgreSQLDialect

  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: http://localhost:8081/realms/tpi-backend/protocol/openid-connect/certs
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when_authorized   # o 'always' si querés ver detalles sin token
      probes:
        enabled: true